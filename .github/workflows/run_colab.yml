name: Executar Sistema GEBRA B3 (v16.1)

on:
  schedule:
    - cron: '0 22 * * 1-5'   # Segunda a sexta, 22h UTC (19h BRT)
  workflow_dispatch:          # Permite execução manual

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências com timeout e retry
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=300 --retries 5 yfinance pandas-ta optuna feedparser vaderSentiment
          pip install --default-timeout=300 --retries 5 nbconvert nbformat papermill ipykernel
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Executar notebook GEBRA v16.1
        env:
          TRADING_EMAIL: ${{ secrets.TRADING_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRAPI_API_TOKEN: ${{ secrets.BRAPI_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          papermill "b3.ipynb" "output.ipynb" --kernel python3 --log-level INFO

      - name: Upload de artefatos (relatório detalhado e logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-gebra-v16_1
          path: |
            relatorio_gebra_v16_1.txt
            log_gebra_v16_1.json
            execucao_detalhada_v16_1.log
            trading_log_v16_1.json
