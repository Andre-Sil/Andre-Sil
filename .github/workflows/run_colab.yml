name: Executar Sistema B3 Diariamente

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências e kernel Jupyter
        run: |
          pip install yfinance pandas-ta optuna feedparser vaderSentiment
          pip install nbconvert nbformat papermill ipykernel
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Executar notebook com papermill
        env:
          TRADING_EMAIL: ${{ secrets.TRADING_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRAPI_API_TOKEN: ${{ secrets.BRAPI_API_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}          # opcional
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}     # opcional
        run: |
          papermill "b3.ipynb" "output.ipynb" --kernel python3

      - name: Upload de artefatos (relatório e log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-gebra
          path: |
            relatorio_detalhado.txt
            resultado_analise.json
            execution_detalhada_v85.log
            trading_log_v85.json
