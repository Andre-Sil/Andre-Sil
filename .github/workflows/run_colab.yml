name: Executar Sistema B3 Diariamente

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔍 Verificar arquivos no repositório (DEBUG)
        run: |
          echo "=== Raiz do repositório ==="
          ls -la
          echo ""
          echo "=== Procurando por arquivos .ipynb ==="
          find . -name "*.ipynb"
          echo ""
          echo "=== Procurando por qualquer arquivo com 'b3' no nome ==="
          find . -name "*b3*"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install yfinance pandas-ta optuna feedparser vaderSentiment
          pip install nbconvert nbformat papermill

      - name: Executar notebook com papermill
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          papermill "b3.ipynb" "output.ipynb" \
            -p EMAIL_REMETENTE "ab11.94958191@gmail.com" \
            -p SENHA_APP "$GMAIL_APP_PASSWORD"
