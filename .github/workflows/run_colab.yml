name: Executar Sistema B3 Diariamente

on:
  schedule:
    # Executa todo dia útil às 22:00 UTC (19:00 horário de Brasília)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:  # permite execução manual

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          pip install yfinance pandas-ta optuna feedparser vaderSentiment
          pip install nbconvert nbformat papermill

      - name: Executar notebook com papermill
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          papermill "seu_notebook.ipynb" "output.ipynb" \
            -p EMAIL_REMETENTE "ab11.94958191@gmail.com" \
            -p SENHA_APP "$GMAIL_APP_PASSWORD"
