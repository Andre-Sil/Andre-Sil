name: Executar Sistema GEBRA B3 (v16.3)

on:
  schedule:
    - cron: '0 22 * * 1-5'   # Segunda a sexta, 22h UTC (19h BRT)
  workflow_dispatch:          # Permite execução manual

jobs:
  run-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install --default-timeout=300 --retries 5 yfinance pandas-ta brapi numpy pandas scipy beautifulsoup4 requests

      - name: Executar script GEBRA v16.3
        env:
          TRADING_EMAIL: ${{ secrets.TRADING_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRAPI_API_TOKEN: ''
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python b3.py

      - name: Upload de artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-gebra-v16_3
          path: |
            relatorio_gebra_*.txt
            *.json
            *.log
          if-no-files-found: warn
